<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Google Login Test</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <main class="card">
    <h1>Dashboard</h1>
    <p id="status" role="status">Comprobando sesión…</p>
    <section id="profile" class="profile" aria-label="Perfil de Google" hidden>
      <div class="avatar">
        <img id="avatar" alt="" referrerpolicy="no-referrer" hidden>
        <span id="initials" aria-hidden="true"></span>
      </div>
      <div class="profile-info">
        <strong id="profile-name"></strong>
        <span id="profile-email"></span>
      </div>
    </section>
    <button id="logout" type="button" hidden>Cerrar sesión</button>
  </main>
</body>
</html>
